# CI — runs on every push and pull request to any branch.
# ⚠ This workflow NEVER deploys anything.  Deploys are manual-only (workflow_dispatch).

name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  # ── 1. Lint & TypeScript type-check ───────────────────────────────────────
  lint-and-type-check:
    name: Lint & type-check (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [orchestrator, integration]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (root)
        run: npm install

      - name: TypeScript — noEmit
        working-directory: ${{ matrix.app }}
        run: npx tsc --noEmit

  # ── 1b. Interface lint (uses next lint, not bare tsc) ─────────────────────
  lint-interface:
    name: Lint & type-check (interface)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (root)
        run: npm install

      - name: Lint
        working-directory: interface
        run: npm run lint

  # ── 2. Unit / integration tests (vitest) ─────────────────────────────────
  test:
    name: Test (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # interface has no server-side test suite — vitest lives in orchestrator + integration
        app: [orchestrator, integration]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (root)
        run: npm install

      - name: Run tests (vitest)
        working-directory: ${{ matrix.app }}
        run: npm test
        env:
          # Tests must never reach live services — mocks only.
          NODE_ENV: test
          GEMINI_API_KEY: ''
          DATABASE_URL: 'postgresql://dummy:dummy@dummy/dummy'
          GITHUB_PAT_TOKEN: 'ci-dummy-token'

  # ── 3. Build check ────────────────────────────────────────────────────────
  build-check:
    name: Build check (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [interface, orchestrator, integration]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (root)
        run: npm install

      - name: Build
        working-directory: ${{ matrix.app }}
        run: npm run build
        env:
          # Provide dummy values so builds never reach real services.
          NODE_ENV: production
          DATABASE_URL: postgresql://dummy:dummy@dummy/dummy
          JWT_SECRET: ci-dummy-secret-not-real
